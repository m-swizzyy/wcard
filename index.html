<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Be My Valentine ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Poppins:wght@400;500&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(180deg, #ffb6c1, #ff4d88);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  font-family: 'Poppins', sans-serif;
}

/* ---------- HEART RAIN (MAIN SCREEN) ---------- */
.heart-rain {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 1;
}

.heart {
  position: absolute;
  top: -40px;
  color: rgba(255,255,255,0.7);
  animation: fall linear forwards;
}

@keyframes fall {
  to {
    transform: translateY(110vh);
    opacity: 0;
  }
}

/* ---------- MAIN CARD ---------- */
.card {
  background: white;
  padding: 30px;
  border-radius: 24px;
  text-align: center;
  width: 92%;
  max-width: 400px;
  z-index: 5;
  box-shadow: 0 30px 50px rgba(0,0,0,0.25);
  transition: transform 0.8s ease, opacity 0.8s ease;
}

.card.hide {
  transform: scale(0.85);
  opacity: 0;
  pointer-events: none;
}

h1 {
  font-family: 'Playfair Display', serif;
  color: #e6005c;
  font-size: 30px;
  min-height: 72px;
}

/* ---------- IMAGE ---------- */
.image-container {
  width: 100%;
  height: 280px;
  margin: 18px 0;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  border-radius: 18px;
  background: #ffe6ee;
}

.image-container img {
  height: 100%;
  opacity: 0;
  animation: fadeIn 2s ease forwards;
  animation-delay: 1.2s;
}

@keyframes fadeIn {
  to { opacity: 1; }
}

/* ---------- BUTTONS ---------- */
.buttons {
  margin-top: 25px;
  position: relative;
  height: 90px;
}

button {
  padding: 12px 28px;
  font-size: 16px;
  border-radius: 30px;
  border: none;
  cursor: pointer;
  position: absolute;
  font-family: 'Poppins', sans-serif;
}

#yesBtn {
  background: #e6005c;
  color: white;
  left: 45px;
}

#noBtn {
  background: #d9d9d9;
  left: 210px;
}

.smh-counter {
  margin-top: 12px;
  font-size: 14px;
  color: #777;
}

/* ---------- CELEBRATION ---------- */
.celebration {
  position: fixed;
  inset: 0;
  background: radial-gradient(circle, #ffb6c1, #ff4d88);
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  opacity: 0;
  pointer-events: none;
  transition: opacity 1s ease;
  z-index: 10;
  overflow: hidden;
}

.celebration.show {
  opacity: 1;
  pointer-events: all;
}

.celebration h2 {
  color: white;
  font-size: 34px;
  margin-bottom: 20px;
  text-align: center;
  z-index: 3;
}

.celebration img {
  width: 320px;
  max-width: 85%;
  border-radius: 20px;
  z-index: 3;
}

/* ---------- CELEBRATION RAIN ---------- */
.rain {
  position: absolute;
  top: -40px;
  animation: fall linear forwards;
  pointer-events: none;
  z-index: 2;
}
</style>
</head>
<body>

<!-- MAIN HEART BACKGROUND -->
<div class="heart-rain" id="heartRain"></div>

<!-- MAIN CARD -->
<div class="card" id="card">
  <h1 id="typeText"></h1>

  <div class="image-container">
    <img src="https://media.tenor.com/Eog9WTKDMAkAAAAe/cat-and-flower.png">
  </div>

  <div class="buttons">
    <button id="yesBtn">Yes 💕</button>
    <button id="noBtn">No 😐</button>
  </div>

  <div class="smh-counter" id="smhCounter">smh x0</div>
</div>

<!-- CELEBRATION -->
<div class="celebration" id="celebration">
  <h2>💖 SHE SAID YES 💖</h2>
  <img src="https://media.tenor.com/PbbHDS_y66QAAAAM/happy-birthday.gif">
</div>

<script>
/* ---------- TYPEWRITER ---------- */
const text = "Will you be my Valentine? ❤️";
const el = document.getElementById("typeText");
let i = 0;
(function type() {
  if (i < text.length) {
    el.textContent += text[i++];
    setTimeout(type, 70);
  }
})();

/* ---------- MAIN HEART RAIN ---------- */
const heartRain = document.getElementById("heartRain");
setInterval(() => {
  const h = document.createElement("div");
  h.className = "heart";
  h.textContent = "❤️";
  h.style.left = Math.random() * 100 + "vw";
  h.style.fontSize = Math.random() * 18 + 14 + "px";
  h.style.animationDuration = Math.random() * 4 + 4 + "s";
  heartRain.appendChild(h);
  setTimeout(() => h.remove(), 8000);
}, 400);

/* ---------- NO BUTTON DODGE ---------- */
const noBtn = document.getElementById("noBtn");
const smhCounter = document.getElementById("smhCounter");
let smh = 0;

function dodge() {
  smh++;
  smhCounter.textContent = "smh x" + smh;
  noBtn.style.position = "fixed";
  noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
  noBtn.style.top = Math.random() * (window.innerHeight - 50) + "px";
}

noBtn.addEventListener("mouseenter", dodge);
noBtn.addEventListener("touchstart", dodge);

/* ---------- YES CLICK ---------- */
const yesBtn = document.getElementById("yesBtn");
const card = document.getElementById("card");
const celebration = document.getElementById("celebration");
const emojis = ["💗","❤️","🤍","🍆","🍑"];

yesBtn.addEventListener("click", () => {
  card.classList.add("hide");
  celebration.classList.add("show");
  startCelebrationRain();
});

/* ---------- CELEBRATION RAIN ---------- */
function startCelebrationRain() {
  setInterval(() => {
    const e = document.createElement("div");
    e.className = "rain";
    e.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    e.style.left = Math.random() * 100 + "vw";
    e.style.fontSize = Math.random() * 28 + 24 + "px";
    e.style.animationDuration = Math.random() * 3 + 2 + "s";
    celebration.appendChild(e);
    setTimeout(() => e.remove(), 6000);
  }, 160);
}
</script>

</body>
</html>
